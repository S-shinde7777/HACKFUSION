<!DOCTYPE html>
<html>
<head>
<title>Pharmacist</title>
</head>

<body>

<h2>Requests</h2>

<button onclick="loadRequests()">Refresh</button>

<div id="requests"></div>

<script>

async function loadRequests() {

const res = await fetch("/api/requests");
const data = await res.json();

let html = "";

data.forEach(r => {

html += `
<p>
${r.patientName} wants
${r.medicineName}
(${r.quantity})

<button onclick="accept(${r.id})">
Accept
</button>

<button onclick="reject(${r.id})">
Reject
</button>

Status: ${r.status}
</p>
`;
});

document.getElementById("requests").innerHTML =
html;
}

async function accept(id){
await fetch(`/api/accept-request/${id}`,
{method:"POST"});
loadRequests();
}

async function reject(id){
await fetch(`/api/reject-request/${id}`,
{method:"POST"});
loadRequests();
}
async function loadMedicines(){

const res = await fetch("/api/medicines");
const data = await res.json();

let html = "";

data.forEach(m => {

html += `
<p>
${m.name} - Stock: ${m.stock}

${m.lowStock ?
"<span style='color:red'>⚠ LOW STOCK</span>"
: ""}

</p>
`;
});

document.getElementById("medicines").innerHTML =
html;
}
</script>
<h2>Medicine Inventory</h2>
<button onclick="loadMedicines()">Load Medicines</button>

<div id="medicines"></div>
</body>
</html>
