<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Medicine System - Pharmacist Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Smart Medicine System - Pharmacist Dashboard</h1>
            <div class="user-info">
                <span id="userDisplay"></span>
                <a href="./login.html" class="logout-btn">Logout</a>
            </div>
        </header>

        <div id="messageContainer"></div>

        <section id="addMedicineSection">
            <h2>Add New Medicine</h2>
            <form id="addMedicineForm">
                <div class="form-group">
                    <label for="medicineName">Medicine Name</label>
                    <input type="text" id="medicineName" required>
                </div>
                <div class="form-group">
                    <label for="stock">Stock Quantity</label>
                    <input type="number" id="stock" min="0" required>
                </div>
                <div class="form-group">
                    <label for="price">Price</label>
                    <input type="number" id="price" step="0.01" min="0" required>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="prescriptionRequired">
                    <label for="prescriptionRequired">Prescription Required</label>
                </div>
                <button type="submit">Add Medicine</button>
            </form>
        </section>
        <section id="bulkStockSection">
            <h2>Bulk Stock Update</h2>
            <div class="form-group">
                <label for="bulkStocks">Stock list (comma-separated)</label>
                <input type="text" id="bulkStocks" placeholder="e.g. 100,30,50">
            </div>
            <button id="applyBulkStocks">Apply Stocks</button>
        </section>

        <section id="medicinesList">
            <h2>Medicine Inventory</h2>
            <div class="table-container">
                <table id="medicinesTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Medicine Name</th>
                            <th>Stock</th>
                            <th>Price</th>
                            <th>Prescription Required</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="medicinesTableBody">
                        <!-- Medicines will be loaded here -->
                    </tbody>
                </table>
            </div>
        </section>

        <section id="requestsList">
            <h2>Patient Requests</h2>
            <div class="table-container">
                <table id="requestsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Patient Name</th>
                            <th>Medicine</th>
                            <th>Quantity</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="requestsTableBody">
                        <!-- Requests will be loaded here -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="pharmacist.js"></script>
</body>
</html>
